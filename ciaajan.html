
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gizli CIA Dosyası</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #050505;
        color: #00ff66;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    .container {
        padding: 30px;
    }

    h1 {
        font-size: clamp(35px, 8vw, 90px);
        font-weight: 900;
        text-shadow: 0 0 15px #00ff66,
                     0 0 35px #00ff66;
        animation: glow 2s infinite alternate;
    }

    p {
        margin-top: 25px;
        color: #ff3333;
        font-size: 20px;
        letter-spacing: 5px;
    }

    @keyframes glow {
        from {
            text-shadow: 0 0 10px #00ff66;
        }
        to {
            text-shadow: 0 0 30px #00ff66,
                         0 0 60px #00ff66;
        }
    }
</style>
</head>

<body>
    <div class="container">
        <h1>CIA AJANI<br>TALHA ENES TİFTİK</h1>
        <p>⚠ GİZLİ DOSYA ⚠</p>
    </div>
</body>
</html>
